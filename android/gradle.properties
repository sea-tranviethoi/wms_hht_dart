org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
org.gradle.user.home=D:\\GradleCache
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Kotlin's incremental-cache path relocation can't compute a relative path
# when the project (D:\...) and the Pub cache (C:\Users\...) are on
# different Windows drive roots -- crashes the compile daemon with
# "this and base files have different roots". Disabling incremental
# compilation avoids that code path entirely (slower rebuilds, but correct).
kotlin.incremental=false
